# Dependabot — low noise for HackMe core
# Monthly grouped PRs; keep open PR count small.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      go-modules:
        patterns:
          - "*"
    ignore:
      # Major bumps often need a dedicated PR / release window
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
