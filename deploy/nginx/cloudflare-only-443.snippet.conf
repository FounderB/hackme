# Cloudflare-only origin guard for public HTTPS (:443).
# Apply INSIDE the ssl server { } for hackme.tech / explorer / etc.
# Do NOT apply to pool-direct :18083/:18443 (miners bypass CF by design).
#
# Install helpers on hub:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo curl -fsSL https://www.cloudflare.com/ips-v4 -o /etc/nginx/snippets/cloudflare-ips-v4.txt
#   sudo curl -fsSL https://www.cloudflare.com/ips-v6 -o /etc/nginx/snippets/cloudflare-ips-v6.txt
#   # then include this snippet after ssl_* lines in each public :443 vhost
#
# Rollback: remove the include + reload nginx (ufw 443 can stay open; nginx enforces).
#
# Health caveat: probes that hit origin IP:443 directly will 403 — use
# https://hackme.tech/healthz.html via Cloudflare, or loopback on the hub.

# Real IP from CF (optional but recommended with allowlist).
# set_real_ip_from entries are generated from the CF IP lists at apply time
# by scripts/ops/apply_cloudflare_origin_guard.sh

# Deny non-CF at the edge of this vhost:
#   include /etc/nginx/snippets/cloudflare-allowlist-map.conf;  # defines $hackme_cf_ok
#   if ($hackme_cf_ok = 0) { return 403; }
#
# Prefer the apply script — it refreshes IP lists and writes the map.

if ($hackme_cf_ok = 0) {
    return 403;
}
