# Direct pool coordinator over TLS (bypass Cloudflare HTTP timeouts).
# Prefer this over cleartext :18083 when clients can validate the origin cert.
#
# Install (hub):
#   sudo cp deploy/nginx/hackme-pool-direct-tls.conf /etc/nginx/sites-enabled/
#   sudo ufw allow 18443/tcp comment 'HackMe pool direct TLS'
#   sudo nginx -t && sudo systemctl reload nginx
#
# Miners (after DNS/cert trust is ready):
#   COORD_URL=https://132.243.112.100:18443
#   # or DNS-only (grey cloud) A record: https://pool-direct.hackme.tech:18443
#
# Keep :18083 cleartext allowlist running until the fleet is migrated — do not
# flip fleet COORD_URL here without a staged rollout.
#
# Cert: reuses origin leaf (CN=hackme.tech). Clients must either trust that
# leaf or pin Host + skip-verify only inside controlled fleet images.
# Long-term: issue a dedicated leaf (LE DNS-01 or CF Origin CA) for
# pool-direct.hackme.tech with IP SAN for 132.243.112.100.

server {
    listen 18443 ssl;
    listen [::]:18443 ssl;
    http2 on;
    server_name pool-direct.hackme.tech 132.243.112.100 _;

    ssl_certificate /etc/ssl/certs/hackme-origin.crt;
    ssl_certificate_key /etc/ssl/private/hackme-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    limit_conn hackme_pool_conn 64;

    # Same miner allowlist as hackme-pool-direct.conf (cleartext :18083).
    include /etc/nginx/snippets/hackme-pool-direct-locations.conf;
}
