# Direct pool coordinator (bypass Cloudflare) — miner allowlist only.
# Install: sudo cp deploy/nginx/hackme-pool-direct.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# Miners: COORD_URL=http://<origin-ip>:18083
#
# SECURITY: port 18083 is cleartext HTTP. Firewall to miner IPs only (or wireguard).
# Do not expose admin settle/outbox/ack routes on this listener without TLS + admin token.
# Prefer Cloudflare/TLS edge for anything beyond claim/submit/health.
#
# Rate limits (zones defined in conf.d/hackme-rate-limit.conf):
#   claim/submit — generous (fleet miners)
#   settle/stats — tighter (abuse / chatty settle loops)

server {
    listen 18083;
    listen [::]:18083;
    server_name _;
    client_max_body_size 8m;

    # Soft connection cap per IP (DDoS / runaway clients).
    limit_conn hackme_pool_conn 64;

    include /etc/nginx/snippets/hackme-pool-direct-locations.conf;
}
