# D0 paper SPA — exchange.hackme.tech (static only, no public matching API)
server {
    listen 80;
    listen [::]:80;
    server_name exchange.hackme.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name exchange.hackme.tech;

    ssl_certificate /etc/ssl/certs/hackme-origin.crt;
    ssl_certificate_key /etc/ssl/private/hackme-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/hackme/web/exchange;
    index index.html;

    # Hub iframe: frame-ancestors MUST be an HTTP header (meta CSP is ignored by browsers).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self' https://hackme.tech http://127.0.0.1:8080 http://localhost:8080; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location = /STATUS.md {
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No public exchange-api on D0 edge
    location /api/ {
        return 404;
    }
}
