# D0 paper SPA — exchange.hackme.tech (static only, no public matching API)
server {
    listen 80;
    listen [::]:80;
    server_name exchange.hackme.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name exchange.hackme.tech;

    ssl_certificate /etc/ssl/certs/hackme-origin.crt;
    ssl_certificate_key /etc/ssl/private/hackme-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/hackme/web/exchange;
    index index.html;

    # Hub iframe: frame-ancestors MUST be HTTP header (meta CSP is ignored by browsers).
    # Full paper policy aligned with vite paper CSP (fonts / connect / CF insights).
    # Cloudflare must not override with X-Frame-Options: SAMEORIGIN — see docs/EXCHANGE_CF_CSP.md
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://hackme.tech; connect-src 'self' https://hackme.tech https://api.binance.com https://cloudflareinsights.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self' https://hackme.tech http://127.0.0.1:8080 http://localhost:8080" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location = /STATUS.md {
        default_type text/markdown;
        try_files $uri =404;
    }

    # Same-origin pool/hub proxies for paper oracle (SPA connect-src 'self').
    location /pool-proxy/ {
        proxy_ssl_server_name on;
        proxy_pass https://hackme.tech/pool/coordinator/;
        proxy_set_header Host hackme.tech;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /hub-proxy/ {
        proxy_ssl_server_name on;
        proxy_pass https://hackme.tech/;
        proxy_set_header Host hackme.tech;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No public exchange-api on D0 edge
    location /api/ {
        return 404;
    }
}
