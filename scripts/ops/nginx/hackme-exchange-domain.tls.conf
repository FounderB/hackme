# LEGACY / REFERENCE ONLY — paper SPA live origin is Caddy on 89.150.41.40
# (scripts/ops/caddy/exchange.Caddyfile).
#
# Mining hub (132.243.112.100): keep this vhost DISABLED in sites-enabled.
# A static proxy_pass https://hackme.tech fails nginx -t/start when DNS flaps
# (CF 521 loop) and takes down the whole hub. Use variable+resolver if you
# must keep a local sketch; prefer disabling the site entirely.

# D0 paper SPA — exchange.hackme.tech (static only, no public matching API)
server {
    listen 80;
    listen [::]:80;
    server_name exchange.hackme.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name exchange.hackme.tech;

    ssl_certificate /etc/ssl/certs/hackme-origin.crt;
    ssl_certificate_key /etc/ssl/private/hackme-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/hackme/web/exchange;
    index index.html;

    # LIVE origin (2026-09+) is Caddy on 89.150.41.40 — see scripts/ops/caddy/exchange.Caddyfile.
    # This nginx sketch is reference / alternate; keep headers in sync with Caddy.
    # Hub iframe: frame-ancestors MUST be HTTP header (meta CSP is ignored by browsers).
    # Full paper policy aligned with vite paper CSP (fonts / connect / CF insights).
    # Do not ship X-Frame-Options: SAMEORIGIN — see docs/EXCHANGE_CF_CSP.md
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://hackme.tech; connect-src 'self' https://hackme.tech https://exchange-api.hackme.tech https://api.binance.com https://cloudflareinsights.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self' https://hackme.tech http://127.0.0.1:8080 http://localhost:8080; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location = /STATUS.md {
        default_type text/markdown;
        try_files $uri =404;
    }

    # Same-origin pool/hub proxies for paper oracle (SPA connect-src 'self').
    # Pool goes direct to coordinator — avoid CF double-hop via hackme.tech.
    location /pool-proxy/ {
        proxy_http_version 1.1;
        proxy_pass http://132.243.112.100:18083/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /hub-proxy/ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        resolver_timeout 5s;
        set $hackme_hub_upstream https://hackme.tech;
        proxy_ssl_server_name on;
        proxy_pass $hackme_hub_upstream/;
        proxy_set_header Host hackme.tech;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Keep headers aligned with scripts/ops/caddy/exchange.Caddyfile (live origin).
    location ~ ^/sw-v5-[a-f0-9]+\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /theme-boot.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /assets/boot- {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # No public exchange-api on D0 edge
    location /api/ {
        return 404;
    }
}
