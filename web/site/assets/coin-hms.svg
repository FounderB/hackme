<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="HMS">
  <defs>
    <linearGradient id="hmsStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="hmsGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="hmsSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- plate -->
  <rect width="128" height="128" rx="28" fill="#070b10"/>
  <rect x="3" y="3" width="122" height="122" rx="26" fill="none" stroke="url(#hmsStroke)" stroke-opacity="0.45" stroke-width="2"/>
  <!-- hex frame -->
  <path d="M64 18 L102 40 L102 84 L64 106 L26 84 L26 40 Z" fill="url(#hmsGlow)" stroke="url(#hmsStroke)" stroke-width="2.5" filter="url(#hmsSoft)"/>
  <!-- sealed capsule / disk -->
  <ellipse cx="64" cy="72" rx="26" ry="9" fill="none" stroke="#67e8f9" stroke-width="2.2" opacity="0.85"/>
  <rect x="38" y="46" width="52" height="26" rx="7" fill="#0a1218" stroke="url(#hmsStroke)" stroke-width="2.4"/>
  <path d="M48 55h32M48 63h18" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <!-- seal check -->
  <circle cx="88" cy="42" r="12" fill="#0a1218" stroke="#34d399" stroke-width="2.2"/>
  <path d="M82.5 42.2l3.2 3.2 7-7" fill="none" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="118" text-anchor="middle" fill="#a5f3fc" font-family="Space Grotesk, IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">HMS</text>
</svg>
